<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Journeys on the highway</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(13, 20, 36, 0.86);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    canvas#highway { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* Top Bar */
    .topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none;
    }
    .brand-card, .action-group {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .brand-title { font-weight: 700; font-size: 14px; letter-spacing: 0.2px; }
    .room-pill {
      font-size: 12px; font-weight: 700; color: #38bdf8;
      background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 3px 9px; border-radius: 999px; cursor: pointer;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: #34d399; background: rgba(16, 185, 129, 0.14);
      padding: 3px 9px; border-radius: 999px; font-weight: 600;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

    .btn {
      background: rgba(255,255,255,0.08); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { background: rgba(255,255,255,0.16); }
    .btn-primary { background: #3b82f6; border-color: #60a5fa; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.32); }

    /* Spectrum Bar */
    .spectrum-wrap {
      position: fixed; top: 68px; left: 16px; right: 16px; z-index: 9;
      pointer-events: none; display: flex; flex-direction: column; align-items: center;
    }
    .spectrum-bar {
      width: 100%; max-width: 680px; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,0.1); overflow: hidden; display: flex;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .spectrum-seg { height: 100%; transition: width 0.4s ease; }

    /* Bottom Dock */
    .dock {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
      width: calc(100% - 24px); max-width: 760px;
      background: var(--panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 12px 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.55);
      display: flex; flex-direction: column; gap: 10px;
    }
    .emotions-row {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .emotions-row::-webkit-scrollbar { display: none; }
    .emo-chip {
      flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
      padding: 8px 13px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); font-size: 13px; font-weight: 600; transition: 0.15s;
    }
    .emo-chip.active { border-color: #fff; background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .swatch { width: 12px; height: 12px; border-radius: 50%; }

    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--border);
      border-radius: 11px; padding: 10px 13px; color: #fff; font-size: 14px; outline: none;
    }
    .input-row input:focus { border-color: #60a5fa; }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(8px); z-index: 30;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 100%; max-width: 400px; background: #0f172a;
      border: 1px solid var(--border); border-radius: 20px; padding: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7); text-align: center;
    }
    .modal-card h2 { font-size: 18px; margin-bottom: 6px; }
    .modal-card p { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
    #qrCanvas { background: #fff; padding: 12px; border-radius: 14px; margin: 0 auto 14px; display: block; }
    .memory-quote {
      font-size: 17px; line-height: 1.55; color: #fff;
      background: rgba(255,255,255,0.05); border-radius: 14px;
      padding: 18px; margin: 12px 0 16px; word-break: break-word;
    }
    .text-input {
      width: 100%; background: rgba(0,0,0,0.45); border: 1px solid var(--border);
      color: #f8fafc; padding: 10px 12px; border-radius: 10px; font-size: 14px;
      margin-bottom: 12px; text-align: center; outline: none;
    }
    .text-input:focus { border-color: #38bdf8; }
    .modal-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    #scannerVideo {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 14px; background: #020617; margin-bottom: 12px;
      border: 2px solid #38bdf8;
    }
  </style>
</head>
<body>

<canvas id="highway"></canvas>

<div class="topbar">
  <div class="brand-card">
    <span class="brand-title">Journeys on the highway</span>
    <span class="room-pill" id="roomBadge" title="Click to switch room">Room: MAIN</span>
    <span class="live-badge"><span class="dot"></span><span id="onlineCount">1 / 100</span></span>
  </div>
  <div class="action-group">
    <button class="btn" id="openRoomBtn">Join Room</button>
    <button class="btn" id="openScannerBtn">Scan QR</button>
    <button class="btn btn-primary" id="openQrBtn">Share QR</button>
    <button class="btn btn-danger" id="openResetBtn">Reset</button>
  </div>
</div>

<div class="spectrum-wrap">
  <div class="spectrum-bar" id="spectrumBar"></div>
</div>

<div class="dock">
  <div class="emotions-row" id="emotionsRow"></div>
  <div class="input-row">
    <button class="btn" id="paintOnlyBtn">Paint Road</button>
